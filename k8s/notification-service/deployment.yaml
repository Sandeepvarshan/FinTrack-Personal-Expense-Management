apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: fintrack
spec:
  replicas: 1
  selector: {matchLabels: {app: notification-service}}
  template:
    metadata: {labels: {app: notification-service}}
    spec:
      containers:
        - name: notification-service
          image: fintrack/notification-service:minikube
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8006}]
          env:
            - {name: DB_HOST, value: mysql}
            - {name: DB_PORT, value: "3306"}
            - {name: DB_NAME, value: expense_tracker}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: app-user}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: app-password}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: jwt-secret}}
          readinessProbe: {httpGet: {path: /health, port: 8006}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8006}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 300m, memory: 256Mi}}