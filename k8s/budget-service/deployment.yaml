apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-service
  namespace: fintrack
spec:
  replicas: 1
  selector: {matchLabels: {app: budget-service}}
  template:
    metadata: {labels: {app: budget-service}}
    spec:
      containers:
        - name: budget-service
          image: fintrack/budget-service:minikube
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8004}]
          env:
            - {name: DB_HOST, value: mysql}
            - {name: DB_PORT, value: "3306"}
            - {name: DB_NAME, value: expense_tracker}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: app-user}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: app-password}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: jwt-secret}}
            - {name: NOTIFICATION_SERVICE_URL, value: http://notification-service:8006}
            - {name: DOWNSTREAM_TIMEOUT_SECONDS, value: "2"}
          readinessProbe: {httpGet: {path: /health, port: 8004}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8004}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 300m, memory: 256Mi}}