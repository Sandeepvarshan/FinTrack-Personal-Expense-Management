apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fintrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: fintrack/user-service:minikube
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: expense_tracker
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: app-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: app-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: jwt-secret
            - name: ACCESS_TOKEN_MINUTES
              value: "60"
          readinessProbe: &backend-probe
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
          livenessProbe:
            <<: *backend-probe
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}